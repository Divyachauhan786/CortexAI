# =============================================================================
# CortexAI Workspace – Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example → .env and fill in all secrets
#   2. docker compose up --build -d
#   3. Open http://localhost:5173
#
# MongoDB Atlas is external – do NOT add a mongo service here.
# Redis + Qdrant are containerised.
# Firebase credentials are bind-mounted (never baked into images).
# =============================================================================

services:

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes these at build time; they're NOT runtime secrets
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: cortexai-frontend
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cortexai-net

  # ─── API Gateway ───────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: cortexai-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      # Docker internal service names – NOT localhost
      FRONTEND_URL: ${VITE_API_GATEWAY_URL:-http://localhost:5173}
      AUTH_SERVICE: http://auth-service:8001
      CHAT_SERVICE: http://chat-service:8002
      AGENT_SERVICE: http://agent-service:8003
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - cortexai-net

  # ─── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: cortexai-auth
    environment:
      PORT: 8001
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      # Firebase: pass the path to the volume-mounted credential file
      FIREBASE_CREDENTIALS_PATH: /app/credentials/cortexai-12345-firebase-adminsdk-abcde.json
    volumes:
      # Bind-mount the credentials dir (read-only) – NEVER copy creds into the image
      - ./services/auth-service/credentials:/app/credentials:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - cortexai-net

  # ─── Chat Service ──────────────────────────────────────────────────────────
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: cortexai-chat
    environment:
      PORT: 8002
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AUTH_SERVICE: http://auth-service:8001
      AGENT_SERVICE: http://agent-service:8003
    depends_on:
      auth-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - cortexai-net

  # ─── Agent Service ─────────────────────────────────────────────────────────
  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    container_name: cortexai-agent
    environment:
      PORT: 8003
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Docker internal service name for Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ai_workspace_documents}
    volumes:
      # Persist uploaded documents across container restarts
      - agent_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - cortexai-net

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cortexai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - cortexai-net

  # ─── Qdrant Vector DB ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: cortexai-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - cortexai-net

# =============================================================================
# Networks
# =============================================================================
networks:
  cortexai-net:
    driver: bridge

# =============================================================================
# Volumes (named – persisted across restarts)
# =============================================================================
volumes:
  redis_data:
  qdrant_data:
  agent_uploads: